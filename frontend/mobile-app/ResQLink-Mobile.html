// ─── Timeout helper ─────────────────────────────────────────────────────
// PROBLEM THIS FIXES: signInWithEmailAndPassword / database .once('value')
// calls have NO timeout. If the device has no internet, or a network
// filter / browser extension / corporate proxy (e.g. Qualys) blocks
// Firebase's auth or reCAPTCHA requests, these promises never resolve AND
// never reject — they just hang forever. Since `loading` is only reset to
// false in the `finally` block AFTER the await settles, the Sign In button
// gets permanently stuck on "Processing…" with no error ever shown.
//
// withTimeout races the given promise against a timer so the UI always
// recovers and the user sees an actionable error message.
function withTimeout(promise, ms = 15000, message = 'Request timed out. Check your internet connection and try again.') {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(message)), ms);
    promise.then(
      (val) => { clearTimeout(timer); resolve(val); },
      (err) => { clearTimeout(timer); reject(err); }
    );
  });
}

// ─── Distance / ETA (Haversine) ─────────────────────────────────────────────
const haversineKm = (a,b) => {
  if(!a||!b) return null;
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.latitude-a.latitude), dLng=toRad(b.longitude-a.longitude);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.latitude))*Math.cos(toRad(b.latitude))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
};

  },
};
const resolveTheme = (pref) => {
  if(pref==='light'||pref==='dark') return pref;
  // system
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  return 'dark';
};
const applyTheme = (pref) => {
  const resolved = resolveTheme(pref);
  document.documentElement.setAttribute('data-theme', resolved);
  return resolved;
};
// Theme context so any screen can read tokens + the current preference.
const ThemeContext = React.createContext({ pref:'system', resolved:'dark', t:THEME_TOKENS.dark, setPref:()=>{} });
const useTheme = () => React.useContext(ThemeContext);

function ThemeProvider({ children }) {
  const [pref,setPrefState] = useState(()=>{
    try { return localStorage.getItem('resqlink-theme') || 'system'; } catch { return 'system'; }
  });
  const [resolved,setResolved] = useState(()=>resolveTheme(pref));

  useEffect(()=>{
    setResolved(applyTheme(pref));
    try { localStorage.setItem('resqlink-theme', pref); } catch {}
  },[pref]);

  // React to OS theme changes when preference is "system"
  useEffect(()=>{
    if(pref!=='system' || !window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const handler = ()=> setResolved(applyTheme('system'));
    mq.addEventListener?.('change', handler);
    return ()=> mq.removeEventListener?.('change', handler);
  },[pref]);

  const setPref = (p) => setPrefState(p);
  const t = THEME_TOKENS[resolved] || THEME_TOKENS.dark;
  return <ThemeContext.Provider value={{pref,resolved,t,setPref}}>{children}</ThemeContext.Provider>;
}

// ─── Network / online status ────────────────────────────────────────────────
function useOnline() {
  const [online,setOnline] = useState(navigator.onLine);
  useEffect(()=>{
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener('online',on); window.addEventListener('offline',off);
    return ()=>{ window.removeEventListener('online',on); window.removeEventListener('offline',off); };
  },[]);
  return online;
}

// ─── Retry helper for DB writes ─────────────────────────────────────────────
async function withRetry(fn, { retries=2, delay=800, label='operation' } = {}) {
  let lastErr;
  for(let i=0;i<=retries;i++){
    try { return await fn(); }
    catch(err){ lastErr=err; console.error(`[withRetry] ${label} attempt ${i+1} failed:`, err);
      if(i<retries) await new Promise(r=>setTimeout(r, delay*(i+1))); }
  }
  throw lastErr;
}

// ─── RTDB Services ──────────────────────────────────────────────────────────
// All mobile<->admin sync flows through these. RTDB onValue == real-time.
const ProfileService = {
  // Always fetch the freshest profile straight from RTDB (never cached state).
  async fetchLatest(uid) {
    if(DEMO_MODE || !uid) return null;
    const snap = await withTimeout(db.ref('users/'+uid).once('value'), 10000, 'Loading your profile timed out.');
    return snap.exists() ? snap.val() : null;
  },
  // Immediately persist any profile field change to RTDB.
  async update(uid, patch) {
    if(DEMO_MODE || !uid) return;
    await withRetry(
      ()=> withTimeout(
        db.ref('users/'+uid).update({ ...patch, updatedAt:firebase.database.ServerValue.TIMESTAMP }),
        10000, 'Saving your changes timed out.'
      ),
      { label:'profile update' }
    );
  },
  subscribe(uid, cb) {
    if(DEMO_MODE || !uid) return ()=>{};
    const ref = db.ref('users/'+uid);
    const handler = ref.on('value', s=> cb(s.exists()?s.val():null), e=>console.error('[ProfileService.subscribe]',e));
    return ()=> ref.off('value', handler);
  },
};

const NotificationService = {
  async push(uid, notif) {
    if(DEMO_MODE || !uid) return;
    const id = genId();
    await db.ref(`notifications/${uid}/${id}`).set({
      id, read:false, createdAt:firebase.database.ServerValue.TIMESTAMP, ...notif,
    }).catch(e=>console.error('[NotificationService.push]',e));
  },
  subscribe(uid, cb) {
    if(DEMO_MODE || !uid) return ()=>{};
    const ref = db.ref(`notifications/${uid}`);
    const handler = ref.on('value', s=>{
      const v=s.val()||{};
      const list=Object.keys(v).map(k=>({id:k,...v[k]})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      cb(list);
    }, e=>console.error('[NotificationService.subscribe]',e));
    return ()=> ref.off('value', handler);
  },
  async markRead(uid, id) {
    if(DEMO_MODE || !uid) return;
    await db.ref(`notifications/${uid}/${id}`).update({read:true}).catch(()=>{});
  },
  async markAllRead(uid, list) {
    if(DEMO_MODE || !uid) return;
    const updates={}; list.forEach(n=>{ if(!n.read) updates[`${n.id}/read`]=true; });
    if(Object.keys(updates).length) await db.ref(`notifications/${uid}`).update(updates).catch(()=>{});
  },
};

const AlertService = {
  // Notify all emergency contacts for an SOS; record delivery status per contact.
  async notifyContacts(sos, contacts) {
    if(DEMO_MODE) return [];
    const results=[];
    for(const c of (contacts||[])){
      if(!c || !c.phone) continue;
      const alertId = genId();
      const link = sos.location ? mapsLink(sos.location.latitude, sos.location.longitude) : '';
      // SMS / push / email are best-effort client-side; deliveryStatus reflects
      // that the alert was queued. A backend function would flip these to 'sent'.
      const record = {
        alertId, sosId: sos.id, contactName: c.name||'Contact', contactPhone: c.phone,
        deliveryStatus: 'queued',
        channel: 'sms',
        message: `🆘 EMERGENCY: ${sos.userName} needs help (${(sos.type||'').replace(/_/g,' ')}). Location: ${link} Time: ${new Date().toLocaleString()}`,
        sentAt: firebase.database.ServerValue.TIMESTAMP,
      };
      try {
        await db.ref('emergency_alerts/'+alertId).set(record);
        results.push({ ...record, deliveryStatus:'queued' });
      } catch(err){
        console.error('[AlertService.notifyContacts]',err);
        await db.ref('emergency_alerts/'+alertId).set({...record,deliveryStatus:'failed'}).catch(()=>{});
        results.push({ ...record, deliveryStatus:'failed' });
      }
    }
    return results;
  },
  // Open the device SMS composer as the SMS fallback channel.
  smsHref(phone, body){ return `sms:${phone}${/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(body)}`; },
};

// ─── Places Service (real nearby facilities from OpenStreetMap) ──────────────
// Uses the free Overpass API (no API key) to find REAL hospitals and police
// stations around the user's live GPS position. Results are de-duplicated,
// distance-sorted, and (for hospitals) published to the `hospitals` RTDB node
// so the admin dashboard sees the same GPS-relevant facilities.
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
];

const PlacesService = {
  // amenity: 'hospital' | 'police' | 'pharmacy' etc. radiusM in meters.
  async fetchNearby(location, amenity, radiusM = 8000) {
    if (!location) return [];
    const { latitude: lat, longitude: lng } = location;
    const query = `[out:json][timeout:20];(
      node["amenity"="${amenity}"](around:${radiusM},${lat},${lng});
      way["amenity"="${amenity}"](around:${radiusM},${lat},${lng});
      relation["amenity"="${amenity}"](around:${radiusM},${lat},${lng});
    );out center 40;`;

    let lastErr;
    for (const url of OVERPASS_ENDPOINTS) {
      try {
        const res = await withTimeout(
          fetch(url + '?data=' + encodeURIComponent(query), { method: 'GET' }),
          20000, 'Finding nearby facilities timed out.'
        );
        if (!res.ok) throw new Error('Overpass HTTP ' + res.status);
        const json = await res.json();
        const items = (json.elements || [])
          .map((el) => {
            const elat = el.lat ?? el.center?.lat;
            const elng = el.lon ?? el.center?.lon;
            if (elat == null || elng == null) return null;
            const tags = el.tags || {};
            const name = tags.name || tags['name:en'] || (amenity === 'police' ? 'Police Station' : 'Hospital');
            const phone = tags.phone || tags['contact:phone'] || tags['contact:mobile'] || '';
            const isPrivate = (tags.healthcare || tags.operator_type || '').toLowerCase().includes('priv');
            const isGov = (tags.operator_type || tags.operator || '').toLowerCase().includes('gov')
              || (tags.operator || '').toLowerCase().includes('government');
            return {
              id: String(el.id),
              name,
              phone,
              latitude: elat,
              longitude: elng,
              type: amenity === 'police' ? 'Police' : isGov ? 'Government' : isPrivate ? 'Private' : 'Hospital',
              address: [tags['addr:street'], tags['addr:city']].filter(Boolean).join(', '),
              source: 'osm',
            };
          })
          .filter(Boolean);

        // De-duplicate by name+rounded coords.
        const seen = new Set();
        const deduped = items.filter((it) => {
          const k = `${it.name}|${it.latitude.toFixed(4)}|${it.longitude.toFixed(4)}`;
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
        return deduped;
      } catch (err) {
        lastErr = err;
        console.error('[PlacesService.fetchNearby]', url, err);
      }
    }
    throw lastErr || new Error('Could not reach the places service.');
  },

  // Publish discovered hospitals to RTDB so the admin dashboard shows them.
  async publishHospitals(hospitals, reporter) {
    if (DEMO_MODE || !hospitals?.length) return;
    const updates = {};
    hospitals.slice(0, 25).forEach((h) => {
      // Stable key from OSM id so repeated publishes upsert rather than duplicate.
      const key = `osm_${h.id}`;
      updates[key] = {
        id: key,
        name: h.name,
        address: h.address || '',
        phone: h.phone || '',
        type: (h.type || 'hospital').toLowerCase(),
        location: { latitude: h.latitude, longitude: h.longitude, timestamp: Date.now() },
        isOpen: true,
        source: 'osm',
        reportedBy: reporter || 'mobile',
        updatedAt: firebase.database.ServerValue.TIMESTAMP,
      };
    });
    try {
      await db.ref('hospitals').update(updates);
    } catch (err) {
      console.error('[PlacesService.publishHospitals]', err);
    }
  },
};

    width: '100%',

    e.preventDefault(); setError(''); setSuccess(''); setLoading(true);

      if(DEMO_MODE) {
        await new Promise(r=>setTimeout(r,700));
        onAuth({uid:'demo-user-'+Date.now(),email:email||'user@demo.com',displayName:name||'Demo User',role:'user',phone});

        const c = await withTimeout(auth.signInWithEmailAndPassword(email,password), 15000, 'Sign-in timed out. Check your internet connection (or any VPN/security app that may be blocking Google services) and try again.');
        const snap = await withTimeout(db.ref('users/' + c.user.uid).once('value'), 10000, 'Connected, but loading your profile timed out. Please try again.');
        const d = snap.exists()?snap.val():{};
        onAuth({uid:c.user.uid,email:c.user.email,displayName:d.displayName||'User',role:d.role||'user',phone:d.phone||'',
          address:d.address||'',bloodGroup:d.bloodGroup||'O+',medicalInfo:d.medicalInfo||'',emergencyContacts:d.emergencyContacts||[],theme:d.theme||'system'});
      } else if(mode==='register') {
        const c = await withTimeout(auth.createUserWithEmailAndPassword(email,password), 15000, 'Sign-up timed out. Check your internet connection (or any VPN/security app that may be blocking Google services) and try again.');

        await withTimeout(db.ref('users/' + c.user.uid).set(userData), 10000, 'Account created, but saving your profile timed out. Please try signing in.');
        onAuth({uid:c.user.uid,email,displayName:name,role:'user',phone,address:'',bloodGroup:'O+',medicalInfo:'',emergencyContacts:[],theme:'system'});
      } else {
        await withTimeout(auth.sendPasswordResetEmail(email), 15000, 'Request timed out. Check your internet connection and try again.');
        setSuccess('Password reset email sent!');
      }
    } catch(err) {
      setError(err.message?.replace('Firebase: ','')?.replace(/\(auth[^)]+\)/,'').trim()||'Error occurred');

            <div style={{width:54,height:54,borderRadius:'50%',background:'linear-gradient(135deg,#FF3B30,#D32F2F)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,boxShadow:'0 6px 20px rgba(255,59,48,.35)'}}>🚨</div>
          </div>
        </div>
        <h2 style={{color:'#F0F1F3',fontSize:24,fontWeight:900,letterSpacing:0.5}}>ResQLink</h2>
        <p style={{color:'#767C87',fontSize:13,marginTop:4,fontWeight:600}}>Emergency Rescue Network</p>
      </div>

      <div style={{flex:1,padding:'24px 20px',overflowY:'auto'}}>
        <div style={{
          background: resolved === 'dark' ? '#101216' : '#FFFFFF',
          borderRadius: 24,
          border: `1px solid ${resolved === 'dark' ? '#1E293B' : '#E2E8F0'}`,

// ─── SOS Screen ────────────────────────────────────────────────────────────
function SOSScreen({user,location,gpsStatus,selectedType,sosActive,setSosActive,onSOSTrigger,emergencyHistory}) {
  const {t} = useTheme();
  const {toast} = useToast();
  const [level,setLevel] = useState(1);
  const [sending,setSending] = useState(false);
  const [sent,setSent] = useState(false);
  const [error,setError] = useState('');
  const [lastSos,setLastSos] = useState(null);
  const [alertResults,setAlertResults] = useState([]);
  const type = EMERGENCY_TYPES.find(t=>t.id===selectedType);

  const handleSOS = async() => {
    if(sending||sent) return;
    setError('');
    if(gpsStatus==='denied'){
      setError('Location permission is denied. Enable location so responders can find you. You can still send, but without coordinates.');
    }
    setSending(true);
    try {
      // CRITICAL: always fetch the freshest profile from RTDB — never cached state.
      let profile = {};
      try { profile = (await ProfileService.fetchLatest(user.uid)) || {}; }
      catch(e){ console.error('[SOS] profile fetch failed, continuing with session data',e); }

      const displayName = profile.displayName || user.displayName || 'User';
      const phone = profile.phone || user.phone || '';
      const bloodGroup = profile.bloodGroup || user.bloodGroup || '';
      const contacts = (Array.isArray(profile.emergencyContacts) && profile.emergencyContacts.length)
        ? profile.emergencyContacts : (user.emergencyContacts||[]);

      const id = genId();
      const emergency = {
        id, sosId:id, userId:user.uid, userName:displayName, userPhone:phone,
        type: selectedType||'accident', level, status:'active',
        location: location||null,
        mapsLink: location?mapsLink(location.latitude,location.longitude):'',
        bloodGroup, medicalInfo: profile.medicalInfo||'',
        emergencyType: (selectedType||'accident'),
        createdAt:Date.now(), updatedAt:Date.now(),
      };

      if(!DEMO_MODE) {
        await withRetry(()=> withTimeout(
          db.ref('emergencies/'+id).set({
            ...emergency,
            createdAt:firebase.database.ServerValue.TIMESTAMP,
            updatedAt:firebase.database.ServerValue.TIMESTAMP,
          }), 12000, 'Sending SOS timed out. Retrying…'
        ), {label:'SOS create'});

        // Notify all emergency contacts → emergency_alerts collection.
        const results = await AlertService.notifyContacts(emergency, contacts);
        setAlertResults(results);

        // In-app notification + activity log (drives admin + notification center).
        await NotificationService.push(user.uid, {type:'sos', title:'SOS Activated',
          body:`Your ${(selectedType||'emergency').replace(/_/g,' ')} alert was sent. ${results.length} contact(s) notified.`});
        await ActivityService.log('sos_created', `${displayName} triggered a ${(selectedType||'emergency').replace(/_/g,' ')} SOS (L${level})`,
          {sosId:id, userId:user.uid, level});
      }

      setLastSos(emergency);
      onSOSTrigger(emergency);
      setSosActive(true); setSent(true);
      toast('SOS sent — help is on the way','success');
    } catch(err){
      console.error('[SOS] failed:',err);
      setError(err.message||'Failed to send SOS. Please try again.');
      toast('Failed to send SOS','error');
    } finally {
      setSending(false);
    }
  };

  const handleCancel = async() => {
    try {
      if(!DEMO_MODE && lastSos?.id){
        await db.ref('emergencies/'+lastSos.id).update({status:'cancelled', updatedAt:firebase.database.ServerValue.TIMESTAMP});
        await NotificationService.push(user.uid, {type:'sos', title:'SOS Cancelled', body:'Your emergency alert was cancelled.'});
        await ActivityService.log('sos_cancelled', `${user.displayName} cancelled their SOS`, {sosId:lastSos.id, userId:user.uid});
      }
    } catch(e){ console.error('[SOS cancel]',e); }
    setSosActive(false); setSent(false); setAlertResults([]);
    toast('SOS cancelled','info',1600);
  };

  return (
    <div style={{height:'100%',overflowY:'auto',paddingBottom:90,backgroundColor:'#07080A'}}>
      <div style={{padding:'48px 20px 20px',textAlign:'center'}}>
        <h2 style={{color:'#F0F1F3',fontSize:22,fontWeight:'900',letterSpacing:'0.3px',marginBottom:4,margin:0}}>Emergency SOS</h2>
        <div style={{display:'inline-block',marginTop:6,padding:'4px 12px',borderRadius:12,backgroundColor:'#1E293B',border:'1px solid #22252B'}}>
          <span style={{color:'#A6ACB6',fontSize:10,fontWeight:'800',letterSpacing:'0.5px'}}>
            {type?`${type.icon} ${type.label.toUpperCase()} SELECTED`:'NO EMERGENCY TYPE SELECTED'}
          </span>
        </div>
      </div>

      {error&&(
        <div style={{margin:'0 20px 16px',padding:'10px 14px',background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',borderRadius:12,color:'#fbbf24',fontSize:12}}>⚠️ {error}</div>
      )}

      {/* Big SOS Button */}
      <div style={{display:'flex',justifyContent:'center',marginBottom:32}}>
        {(() => {
          const lvl = SOS_LEVELS[level] || SOS_LEVELS[1];
          return (
            <div style={{width:230,height:230,borderRadius:'50%',border:'1px solid rgba(255, 59, 48, 0.06)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{width:200,height:200,borderRadius:'50%',border:'1.5px solid rgba(255, 59, 48, 0.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <button onClick={handleSOS} disabled={sending||sent}
                  style={{width:170,height:170,borderRadius:'50%',
                    background:sent?'#2FD67C':sending?'#F5B94D':lvl.color,
                    border:`6px solid ${sent?'rgba(16,185,129,0.3)':sending?'rgba(245,158,11,0.3)':'rgba(255,59,48,0.3)'}`,
                    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:sending||sent?'default':'pointer',
                    boxShadow:sent?'0 12px 30px rgba(16,185,129,0.5)':sending?'0 12px 30px rgba(245,158,11,0.5)':`0 12px 30px ${lvl.color}80`,
                    transition:'all .3s',outline:'none'}}>
                  <span style={{fontSize:44,marginBottom:4}}>{sent?'✓':sending?'⏳':'🆘'}</span>
                  <span style={{color:'#fff',fontWeight:900,fontSize:16,letterSpacing:.5}}>
                    {sent?'SENT':sending?'SENDING':`SOS · L${level}`}
                  </span>
                </button>
              </div>
            </div>
          );
        })()}
      </div>

      {/* Level selector */}
      {!sent&&!sending&&(
        <div style={{padding:'0 20px 24px'}}>
          <p style={{color:'#A6ACB6',fontSize:11,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:12,fontWeight:'800'}}>Emergency severity level</p>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {[1,2,3].map(l=>{
              const info = SOS_LEVELS[l];
              const active = level===l;
              return (
                <button key={l} onClick={()=>setLevel(l)}
                  style={{padding:'14px 16px',borderRadius:20,border:`1px solid ${active?info.color:'#1E293B'}`,background:active?`${info.color}10`:'#101216',cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:12,outline:'none'}}>
                  <div style={{width:32,height:32,borderRadius:10,background:`${info.color}18`,display:'flex',alignItems:'center',justifyContent:'center',color:info.color,fontSize:13,fontWeight:'800',flexShrink:0}}>L{l}</div>
                  <div style={{flex:1}}>
                    <p style={{color:active?'#FFFFFF':'#A6ACB6',fontSize:14,fontWeight:'700',margin:0}}>{info.label}</p>
                    <p style={{color:'#64748B',fontSize:11,marginTop:2,fontWeight:'500',margin:0}}>{info.desc}</p>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Status */}
      {sent&&(
        <div style={{padding:'0 20px'}} className="slide-up">
          <div style={{padding:'20px',borderRadius:20,background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.25)',marginBottom:16,textAlign:'center'}}>
            <p style={{color:'#34d399',fontSize:15,fontWeight:'800',margin:0}}>🚨 Help is on the way</p>
            {(()=> { const lv=SOS_LEVELS[level]||SOS_LEVELS[1]; return (
              <span style={{display:'inline-block',fontSize:11,fontWeight:800,padding:'2px 10px',borderRadius:999,background:`${lv.color}22`,color:lv.color,border:`1px solid ${lv.color}44`,margin:'8px 0'}}>L{level} · {lv.label}</span>

            <p style={{color:'#A6ACB6',fontSize:12,margin:0,lineHeight:'18px',fontWeight:'600'}}>

            {location&&<a href={mapsLink(location.latitude,location.longitude)} target="_blank" style={{color:'#60a5fa',fontSize:11,marginTop:8,fontFamily:'monospace',display:'inline-block',textDecoration:'underline'}}>📍 {location.latitude.toFixed(4)}, {location.longitude.toFixed(4)} (open map)</a>}

                  <span style={{fontSize:11,padding:'2px 8px',borderRadius:999,background:a.deliveryStatus==='failed'?'rgba(255,59,48,.12)':'rgba(16,185,129,.12)',color:a.deliveryStatus==='failed'?'#f87171':'#34d399'}}>{a.deliveryStatus}</span>
                </div>
              ))}
            </div>
          )}
          <button onClick={handleCancel} style={{width:'100%',marginTop:20,padding:'14px',borderRadius:16,background:'rgba(239, 68, 68, 0.05)',border:'1px solid #EF4444',color:'#EF4444',fontSize:14,fontWeight:700,cursor:'pointer'}}>
            Cancel SOS Alert
          </button>
        </div>
      )}
    </div>
  );
}

// ─── AI Assistant Screen ────────────────────────────────────────────────────
function AIScreen({user}) {
  const [messages,setMessages] = useState([
    {id:1, role:'assistant', text:'Hi! I\'m ResQAI, your emergency assistant. Tell me what happened and I\'ll guide you through the best response.\n\n🚨 In critical situations, always press the SOS button first, then talk to me.', time:Date.now()}
  ]);
  const [input,setInput] = useState('');
  const [loading,setLoading] = useState(false);
  const [apiMode,setApiMode] = useState('demo');
  const [apiKey,setApiKey] = useState('');
  const [showSettings,setShowSettings] = useState(false);
  const bottomRef = useRef(null);

  const scrollBottom = () => { bottomRef.current?.scrollIntoView({behavior:'smooth'}); };
  useEffect(()=>{ scrollBottom(); },[messages]);

  const QUICK = ['Snake bite help','Heart attack steps','Heavy bleeding','I\'m lost in forest','Earthquake safety'];

  const send = async(text=input) => {
    if(!text.trim()||loading) return;
    const userMsg = {id:Date.now(),role:'user',text:text.trim(),time:Date.now()};
    setMessages(m=>[...m,userMsg]); setInput(''); setLoading(true);
    try {
      let reply;
      if(apiMode==='openai'&&apiKey) {
        const res = await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
          body:JSON.stringify({model:'gpt-3.5-turbo',max_tokens:300,messages:[
            {role:'system',content:'You are ResQAI, an emergency first aid assistant. Give concise, numbered, actionable emergency guidance. Always recommend calling emergency services for serious situations.'},
            ...messages.slice(-4).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text})),
            {role:'user',content:text}
          ]})});
        const d = await res.json();
        reply = d.choices?.[0]?.message?.content||getAIResponse(text);
      } else {
        await new Promise(r=>setTimeout(r,800));
        reply = getAIResponse(text);
      }
      setMessages(m=>[...m,{id:Date.now()+1,role:'assistant',text:reply,time:Date.now()}]);
    } catch { setMessages(m=>[...m,{id:Date.now()+1,role:'assistant',text:getAIResponse(text),time:Date.now()}]); }
    finally { setLoading(false); }
  };

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#07080A'}}>
      {/* Header */}
      <div style={{padding:'48px 20px 16px',background:'linear-gradient(160deg,#101216,#1e0a3c)',borderBottom:'1px solid #181B20',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:42,height:42,borderRadius:16,background:'linear-gradient(135deg,#7c3aed,#4c1d95)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🤖</div>
            <div>
              <p style={{color:'#f1f5f9',fontSize:16,fontWeight:700}}>ResQAI</p>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <div style={{width:5,height:5,borderRadius:'50%',background:'#10b981'}} className="pulse"/>
                <p style={{color:'#34d399',fontSize:11}}>Emergency Assistant · Online</p>
              </div>
            </div>
          </div>
          <button onClick={()=>setShowSettings(!showSettings)} style={{background:'rgba(255,255,255,.06)',border:'1px solid #22252B',borderRadius:12,padding:'6px 12px',color:'#767C87',fontSize:12,cursor:'pointer'}}>
            ⚙️ API
          </button>
        </div>

        {showSettings&&(
          <div style={{marginTop:12,padding:'12px',borderRadius:16,background:'rgba(0,0,0,.3)',border:'1px solid #22252B'}} className="slide-up">
            <select value={apiMode} onChange={e=>setApiMode(e.target.value)}
              style={{width:'100%',background:'#181B20',border:'1px solid #22252B',borderRadius:8,padding:'8px 12px',color:'#f1f5f9',fontSize:13,marginBottom:8}}>
              <option value="demo">Demo Mode (no API key needed)</option>
              <option value="openai">OpenAI GPT (paste key below)</option>
            </select>
            {apiMode==='openai'&&(
              <input value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-..." type="password"
                style={{width:'100%',background:'#181B20',border:'1px solid #22252B',borderRadius:8,padding:'8px 12px',color:'#f1f5f9',fontSize:13}}/>
            )}
          </div>
        )}
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'16px',display:'flex',flexDirection:'column',gap:12}}>
        {messages.map(m=>(
          <div key={m.id} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
            {m.role==='assistant'&&<div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#7c3aed,#4c1d95)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,marginRight:8,marginTop:2}}>🤖</div>}
            <div style={{maxWidth:'80%',padding:'12px 14px',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',
              background:m.role==='user'?'linear-gradient(135deg,#7c3aed,#4c1d95)':'#181B20',
              border:m.role==='assistant'?'1px solid #22252B':'none',fontSize:13,color:'#e2e8f0',lineHeight:1.6,whiteSpace:'pre-wrap'}}>
              {m.text}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex',alignItems:'flex-end',gap:8}}>
            <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#7c3aed,#4c1d95)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🤖</div>
            <div style={{padding:'12px 16px',borderRadius:'16px 16px 16px 4px',background:'#181B20',border:'1px solid #22252B',display:'flex',gap:4,alignItems:'center'}}>
              {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:'50%',background:'#2E333B',animation:`pulse ${.6+i*.15}s ease-in-out infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Quick prompts */}
      <div style={{padding:'8px 16px',display:'flex',gap:8,overflowX:'auto',flexShrink:0,scrollbarWidth:'none'}}>
        {QUICK.map(q=>(
          <button key={q} onClick={()=>send(q)} style={{padding:'6px 12px',borderRadius:999,background:'rgba(124,58,237,.1)',border:'1px solid rgba(124,58,237,.3)',color:'#a78bfa',fontSize:11,whiteSpace:'nowrap',cursor:'pointer',flexShrink:0}}>
            {q}
          </button>
        ))}
      </div>

      {/* Input */}
      <div style={{padding:'12px 16px 80px',borderTop:'1px solid #181B20',flexShrink:0,display:'flex',gap:10}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Describe your emergency…"
          style={{flex:1,background:'#181B20',border:'1px solid #22252B',borderRadius:24,padding:'12px 16px',color:'#f1f5f9',fontSize:14,outline:'none',fontFamily:'inherit'}}/>
        <button onClick={()=>send()} disabled={!input.trim()||loading}
          style={{width:48,height:48,borderRadius:24,background:input.trim()&&!loading?'linear-gradient(135deg,#7c3aed,#4c1d95)':'#181B20',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:input.trim()&&!loading?'pointer':'default',fontSize:18,flexShrink:0}}>
          {loading?<div style={{width:16,height:16,border:'2px solid #7c3aed',borderTopColor:'transparent',borderRadius:'50%'}} className="spin"/>:'➤'}
        </button>
      </div>
    </div>
  );
}

// ─── Medical Profile Screen ─────────────────────────────────────────────────
function ProfileScreen({user}) {
  const {t} = useTheme();
  const {toast} = useToast();
  const [tab,setTab] = useState('personal');
  const [saving,setSaving] = useState(false);
  const [saved,setSaved] = useState(false);
  const BLOOD = ['A+','A-','B+','B-','AB+','AB-','O+','O-'];
  const [profile,setProfile] = useState({
    fullName: user.displayName||'', age:'', gender:'', height:'', weight:'', bloodGroup: user.bloodGroup||'O+', organDonor:false,
    allergies:'', medications:'', medicalConditions:'',
    contact1Name:'', contact1Phone:'', contact1Rel:'Father',
    contact2Name:'', contact2Phone:'', contact2Rel:'Mother',
  });

  useEffect(()=>{
    if(DEMO_MODE) return;
    (async()=>{
      try {
        const snap = await db.ref('medical_profiles/'+user.uid).once('value');
        if(snap.exists()){
          const v = snap.val();
          setProfile(p=>({
            ...p,
            fullName: v.fullName||user.displayName||'',
            age: v.age||'', gender: v.gender||'', height: v.height||'', weight: v.weight||'',
            bloodGroup: v.bloodGroup||user.bloodGroup||'O+',
            organDonor: !!v.organDonor,
            allergies: Array.isArray(v.allergies)?v.allergies.join(', '):v.allergies||'',
            medications: Array.isArray(v.medications)?v.medications.join(', '):v.medications||'',
            medicalConditions: Array.isArray(v.medicalConditions)?v.medicalConditions.join(', '):v.medicalConditions||'',
            contact1Name: v.emergencyContacts?.[0]?.name||'',
            contact1Phone: v.emergencyContacts?.[0]?.phone||'',
            contact1Rel: v.emergencyContacts?.[0]?.relation||'Father',
            contact2Name: v.emergencyContacts?.[1]?.name||'',
            contact2Phone: v.emergencyContacts?.[1]?.phone||'',
            contact2Rel: v.emergencyContacts?.[1]?.relation||'Mother',
          }));
        }
      } catch(e){ console.error('[Profile] fetch failed',e); }
    })();
  },[user.uid]);

  const save = async () => {
    setSaving(true); setSaved(false);
    try {
      const medical = {
        userId: user.uid,
        fullName: profile.fullName.trim(),
        age: parseInt(profile.age)||null,
        gender: profile.gender||null,
        height: parseFloat(profile.height)||null,
        weight: parseFloat(profile.weight)||null,
        bloodGroup: profile.bloodGroup,
        allergies: profile.allergies.split(',').map(s=>s.trim()).filter(Boolean),
        medications: profile.medications.split(',').map(s=>s.trim()).filter(Boolean),
        medicalConditions: profile.medicalConditions.split(',').map(s=>s.trim()).filter(Boolean),
        organDonor: profile.organDonor,
        emergencyContacts: [
          profile.contact1Name.trim() && { name:profile.contact1Name.trim(), phone:profile.contact1Phone.trim(), relation:profile.contact1Rel },
          profile.contact2Name.trim() && { name:profile.contact2Name.trim(), phone:profile.contact2Phone.trim(), relation:profile.contact2Rel },
        ].filter(Boolean),
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      };
      await db.ref('medical_profiles/'+user.uid).set(medical);
      setSaved(true); toast('Profile saved','success');
    } catch(e) { toast('Save failed','error'); } finally {
      setSaving(false);
    }
  };

  const inp = {width:'100%',background:'#070B14',border:'1px solid #1E293B',borderRadius:16,padding:'12px 14px',color:'#FFFFFF',fontSize:14,outline:'none',marginBottom:12,fontFamily:'inherit',fontWeight:'500'};
  const fld = (label,key,type='text',ph='') => (

      <input type={type} value={profile[key]} onChange={e=>setProfile(p=>({...p,[key]:e.target.value}))} placeholder={ph} style={inp}/></div>
  );

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',backgroundColor:'#07080A'}}>

        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{width:48,height:48,borderRadius:20,background:'linear-gradient(135deg,#FF3B30,#FF6B6B)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,border:'1.5px solid rgba(255,255,255,0.15)'}}>👤</div>
          <div>
            <h2 style={{color:'#F0F1F3',fontSize:18,fontWeight:'900',letterSpacing:'0.3px',margin:0}}>Medical Profile</h2>
            <p style={{color:'#64748B',fontSize:12,margin:0,marginTop:2,fontWeight:'600'}}>In Case of Emergency (ICE)</p>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {['personal','medical','contacts'].map(t=>(
            <button key={t} onClick={()=>setTab(t)}
              style={{flex:1,padding:'11px',borderRadius:16,border:`1px solid ${tab===t?'#FF3B30':'#1E293B'}`,background:tab===t?'rgba(255,59,48,.1)':'transparent',color:tab===t?'#FFFFFF':'#A6ACB6',fontSize:12,fontWeight:700,cursor:'pointer',textTransform:'capitalize',outline:'none'}}>
              {t}

        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'20px 20px 0'}}>
        {tab==='personal'&&<>
          {fld('Full Name','fullName','text','Your full name')}

              <select value={profile.gender} onChange={e=>setProfile(p=>({...p,gender:e.target.value}))} style={{...inp,marginBottom:0}}>
                <option value="">Select</option>
                <option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
              </select>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}}>
            {fld('Height (cm)','height','number','175')}

// ─── History Screen ─────────────────────────────────────────────────────────

            {emergencyHistory.map(e=>{
              const type = EMERGENCY_TYPES.find(t=>t.id===e.type)||{icon:'⚠️',label:e.type,color:'#767C87'};

                      </div>
                    </div>
                    <span style={{fontSize:11,padding:'3px 10px',borderRadius:999,background:`${sc}15`,color:sc,border:`1px solid ${sc}30`,fontWeight:700,textTransform:'capitalize'}}>{e.status}</span>

                  <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8,paddingTop:12,borderTop:'1px solid rgba(255,255,255,0.02)'}}>
                    {[
                      {done:true, label:'SOS Activated'},
                      {done:e.status!=='active', label:'Team Assigned'},

                      <div key={i} style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:14,height:14,borderRadius:'50%',background:s.done?'#10b981':'#1E293B',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,color:'#fff'}}>{s.done?'✓':''}</div>
                        <span style={{fontSize:11,color:s.done?'#34d399':'#64748B',fontWeight:'600'}}>{s.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
      }
    </div>
  );
}

// ─── Nearby Services ────────────────────────────────────────────────────────
function NearbyScreen({location, gpsStatus}) {
  const {t, resolved} = useTheme();
  const {toast} = useToast();
  const [tab,setTab] = useState('hospitals');
  const [ambulances,setAmbulances] = useState([]);
  const [hospitals,setHospitals] = useState([]);
  const [police,setPolice] = useState([]);
  const [loading,setLoading] = useState(false);
  const [placesError,setPlacesError] = useState('');
  const publishedRef = useRef(false);

  // Static fallback (used only if the live places lookup fails or GPS is off).
  const FALLBACK = {
    hospitals:[
      {id:'fb-h1',name:'PSG Hospital',phone:'0422-4345678',type:'Private',latitude:11.0258,longitude:76.9569},
      {id:'fb-h2',name:'Govt. Medical College',phone:'0422-2301393',type:'Government',latitude:11.0089,longitude:76.9690},
      {id:'fb-h3',name:'KMCH',phone:'0422-4323800',type:'Private',latitude:11.0312,longitude:76.9410},
    ],
    police:[
      {id:'fb-p1',name:'Peelamedu Police Station',phone:'0422-2570892',type:'Police',latitude:11.0270,longitude:76.9610},
      {id:'fb-p2',name:'Race Course Police Station',phone:'0422-2222100',type:'Police',latitude:11.0050,longitude:76.9720},
    ],
  };

  // Fetch REAL hospitals + police around the user's live GPS via Overpass.
  useEffect(()=>{
    if(!location || gpsStatus!=='active') return;
    let active = true;
    setLoading(true); setPlacesError('');
    (async()=>{
      try {
        const [h, p] = await Promise.all([
          PlacesService.fetchNearby(location, 'hospital', 10000),
          PlacesService.fetchNearby(location, 'police', 10000),
        ]);
        if(!active) return;
        setHospitals(h); setPolice(p);
        // Publish discovered hospitals to RTDB once per session so the admin
        // dashboard shows the same GPS-relevant facilities.
        if(!publishedRef.current && h.length){
          publishedRef.current = true;
          PlacesService.publishHospitals(h, 'mobile-app');
        }
      } catch(err){
        if(!active) return;
        console.error('[Nearby] places lookup failed:', err);
        setPlacesError('Could not load live facilities — showing offline list.');
        setHospitals([]); setPolice([]);
      } finally { if(active) setLoading(false); }
    })();
    return ()=>{ active=false; };
  },[location?.latitude, location?.longitude, gpsStatus]);

  // Ambulances come live from RTDB; fall back to a small static set if empty.
  useEffect(()=>{
    if(DEMO_MODE) return;
    const ref = db.ref('ambulances');
    const h = ref.on('value', s=>{
      const v=s.val()||{};
      setAmbulances(Object.keys(v).map(k=>({id:k,...v[k]})));
    }, e=>console.error('[Nearby ambulances]',e));
    return ()=> ref.off('value', h);
  },[]);

  const withDistances = (arr)=> arr.map(s=>{
    const d = haversineKm(location, s);
    return {...s, _dist:d};
  }).sort((a,b)=> (a._dist??1e9)-(b._dist??1e9));

  const liveHospitals = hospitals.length ? hospitals : FALLBACK.hospitals;
  const livePolice = police.length ? police : FALLBACK.police;
  const hospitalList = withDistances(liveHospitals);
  const policeList = withDistances(livePolice);
  const ambList = withDistances(
    (ambulances.length?ambulances:[
      {id:'AMB-001',name:'City Ambulance 1',status:'available',phone:'108',latitude:11.0210,longitude:76.9560},
      {id:'AMB-002',name:'Rapid Response 2',status:'available',phone:'108',latitude:11.0150,longitude:76.9650},
    ]).map(a=>({...a, location: unitLoc(a)})).map(a=>({...a, latitude:a.location?.latitude, longitude:a.location?.longitude}))
  );

  const TABS=[['hospitals','Hospitals'],['police','Police'],['ambulances','Ambulances']];

  const call = (phone)=>{ if(!phone){ toast('No phone number listed','warning'); return; } window.location.href=`tel:${phone}`; };
  const navigate = (s)=>{
    if(s.latitude==null||s.longitude==null){ toast('Location unavailable for this service','warning'); return; }
    window.open(navLink(s.latitude,s.longitude),'_blank');
  };

  const card = {padding:16,borderRadius:24,background:'#101216',border:'1px solid #1E293B'};

  const subtitle = gpsStatus==='active'&&location
    ? (loading ? '⏳ Finding facilities near you…' : 'Real facilities near your live location')
    : gpsStatus==='denied' ? '⛔ Enable location to find facilities near you'
    : '⚡ Acquiring GPS… facilities load automatically';

  const renderFacility = (s,i,kind) => (
    <div key={s.id||i} style={card}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:44,height:44,borderRadius:12,backgroundColor:`${kind==='police'?'#3B82F6':'#EF4444'}15`,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:22}}>{kind==='police'?'👮':'🏥'}</span>
          </div>
          <div>
            <p style={{color:'#FFFFFF',fontSize:14,fontWeight:'800',margin:0}}>{s.name}</p>
            <p style={{color:'#64748B',fontSize:12,margin:0,marginTop:2,fontWeight:'600'}}>📍 {fmtDistance(s._dist)} · ⏱ {fmtEta(s._dist)}{s.type?` · ${s.type}`:''}</p>
            {s.address&&<p style={{color:'#64748B',fontSize:11,marginTop:2,margin:0,lineHeight:'14px',fontWeight:'500'}}>{s.address}</p>}
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>call(s.phone)} style={{flex:1,padding:10,borderRadius:14,background:'rgba(255,255,255,0.02)',border:'1px solid #1E293B',color:'#A6ACB6',fontSize:13,fontWeight:700,cursor:'pointer',outline:'none'}}>📞 {s.phone||'Call'}</button>
        <button onClick={()=>navigate(s)} style={{flex:1,padding:10,borderRadius:14,background:'rgba(255,255,255,0.02)',border:'1px solid #1E293B',color:'#A6ACB6',fontSize:13,fontWeight:700,cursor:'pointer',outline:'none'}}>🗺 Navigate</button>
      </div>
    </div>
  );

  return (
    <div style={{height:'100%',overflowY:'auto',paddingBottom:90,background:'#07080A'}}>
      <div style={{padding:'48px 20px 16px',background:'#07080A'}}>
        <h2 style={{color:'#F0F1F3',fontSize:22,fontWeight:'900',letterSpacing:'0.3px',marginBottom:4,margin:0}}>Nearby Services</h2>
        <p style={{color:'#64748B',fontSize:13,margin:0,fontWeight:'600'}}>{subtitle}</p>
        {placesError&&<p style={{color:'#fbbf24',fontSize:12,marginTop:6,margin:0}}>⚠️ {placesError}</p>}
        <div style={{display:'flex',gap:8,marginTop:16}}>
          {TABS.map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)}
              style={{flex:1,padding:'11px',borderRadius:16,border:`1px solid ${tab===k?'#FF3B30':'#1E293B'}`,background:tab===k?'rgba(255,59,48,.1)':'transparent',color:tab===k?'#f87171':'#94a3b8',fontSize:12,fontWeight:700,cursor:'pointer',outline:'none'}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:10}}>
        {loading && (tab==='hospitals'||tab==='police') && (
          <div style={{display:'flex',justifyContent:'center',padding:24}}>
            <div style={{width:24,height:24,border:'2px solid #1E293B',borderTopColor:'#FF3B30',borderRadius:'50%'}} className="spin"/>
          </div>
        )}

        {!loading && tab==='hospitals' && (hospitalList.length===0
          ? <EmptyState icon="🏥" title="No hospitals found nearby" subtitle="Try moving to an area with coverage or check your connection."/>
          : hospitalList.map((s,i)=>renderFacility(s,i,'hospital')))}

        {!loading && tab==='police' && (policeList.length===0
          ? <EmptyState icon="👮" title="No police stations found nearby" subtitle="Try again once your GPS signal improves."/>
          : policeList.map((s,i)=>renderFacility(s,i,'police')))}

        {tab==='ambulances' && (ambList.length===0
          ? <EmptyState icon="🚑" title="No ambulances nearby" subtitle="Available units will appear here as they come online."/>
          : ambList.map((s,i)=>{
            const avail = (s.status||'available')==='available';
            return (
              <div key={i} style={card}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:44,height:44,borderRadius:12,backgroundColor:'rgba(255, 59, 48, 0.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <span style={{fontSize:26}}>🚑</span>
                    </div>
                    <div>
                      <p style={{color:'#FFFFFF',fontSize:14,fontWeight:'800',margin:0}}>{s.name||s.id}</p>
                      <p style={{color:'#64748B',fontSize:12,margin:0,marginTop:2,fontWeight:'600'}}>ID: {s.id} · 📍 {fmtDistance(s._dist)} · ⏱ ETA {fmtEta(s._dist)}</p>
                    </div>
                  </div>
                  <span style={{fontSize:11,padding:'3px 10px',borderRadius:999,background:avail?'rgba(16,185,129,.1)':'rgba(245,158,11,.1)',color:avail?'#34d399':'#fbbf24',border:`1px solid ${avail?'rgba(16,185,129,.3)':'rgba(245,158,11,.3)'}`,fontWeight:600}} className={avail?'':'pulse'}>
                    {(s.status||'available').replace(/_/g,' ').toUpperCase()}
                  </span>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={()=>call(s.phone||'108')} style={{flex:1,padding:10,borderRadius:14,background:'rgba(255,255,255,0.02)',border:'1px solid #1E293B',color:'#A6ACB6',fontSize:13,fontWeight:700,cursor:'pointer',outline:'none'}}>📞 Call {s.phone||'108'}</button>
                  <button onClick={()=>navigate(s)} style={{flex:1,padding:10,borderRadius:14,background:'rgba(255,255,255,0.02)',border:'1px solid #1E293B',color:'#A6ACB6',fontSize:13,fontWeight:700,cursor:'pointer',outline:'none'}}>🗺 Track</button>
                </div>
              </div>
            );
          }))}
      </div>
    </div>
  );
}

// ─── Drone Screen ──────────────────────────────────────────────────────────
function DroneScreen() {
  const [droneStatus,setDroneStatus] = useState('standby');

  const [altitude,setAltitude] = useState(0);
  const [speed,setSpeed] = useState(0);

    setDroneStatus('searching'); setAltitude(80); setSpeed(45); setProgress(15);
    setTimeout(()=>{setDroneStatus('en_route'); setAltitude(120); setSpeed(60); setProgress(45);},3000);
    setTimeout(()=>{setDroneStatus('victim_located'); setAltitude(30); setSpeed(10); setProgress(80);},8000);
    setTimeout(()=>{setDroneStatus('rescue_complete'); setAltitude(0); setSpeed(0); setProgress(100);},14000);

          <div style={{fontSize:64,marginBottom:12}}>🚁</div>
          <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 16px',borderRadius:999,background:`${info.color}20`,border:`1px solid ${info.color}40`,marginBottom:8}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:info.color}} className={droneStatus!=='standby'&&droneStatus!=='rescue_complete'?'pulse':''}/>
            <span style={{color:info.color,fontSize:13,fontWeight:600}}>{info.label}</span>
          </div>
          <p style={{color:'#767C87',fontSize:12}}>{info.desc}</p>

          {progress>0&&<div style={{marginTop:16}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:6}}>
              <span style={{color:'#2E333B'}}>Mission Progress</span>
              <span style={{color:'#94a3b8'}}>{progress}%</span>
            </div>
            <div style={{height:6,borderRadius:999,background:'#181B20'}}>
              <div style={{height:6,borderRadius:999,background:'linear-gradient(90deg,#3b82f6,#8b5cf6)',width:`${progress}%`,transition:'width 1s ease'}}/>
            </div>
          </div>}
        </div>
      </div>

      <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
        {/* Stats grid */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[
            {label:'Battery',value:`${battery}%`,color:battery>50?'#10b981':battery>20?'#f59e0b':'#FF3B30',icon:'🔋'},
            {label:'Altitude',value:`${altitude}m`,color:'#60a5fa',icon:'📏'},

            {label:'Range',value:'5 km',color:'#34d399',icon:'📡'},

        {/* Controls */}
        <div style={{display:'flex',gap:10}}>

            ? <button onClick={launch} style={{flex:1,padding:'16px',borderRadius:24,background:'linear-gradient(135deg,#1d4ed8,#1e40af)',border:'none',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 8px 24px rgba(29,78,216,.4)'}}>

  const [contacts,setContacts] = useState(()=> Array.isArray(user?.emergencyContacts) && user.emergencyContacts.length

    let active=true;
    (async()=>{
      try {
        const latest = await ProfileService.fetchLatest(user?.uid);
        if(active && latest){
          setForm({
            displayName:latest.displayName||user?.displayName||'', phone:latest.phone||'',
            address:latest.address||'', bloodGroup:latest.bloodGroup||'O+', medicalInfo:latest.medicalInfo||'',
          });
          if(Array.isArray(latest.emergencyContacts)&&latest.emergencyContacts.length) setContacts(latest.emergencyContacts);
        }
      } catch(err){ console.error('[Settings] profile load:',err); toast('Could not load latest profile','error'); }
      finally { if(active) setLoadingProfile(false); }
    })();
    return ()=>{ active=false; };
  },[user?.uid]);

  const card = {background:t.surface,border:`1px solid ${t.border}`,borderRadius:16,padding:16,marginBottom:14};
  const inp = {width:'100%',background:t.inputBg,border:`1px solid ${t.border2}`,borderRadius:16,padding:'12px 14px',color:t.text,fontSize:14,outline:'none',marginBottom:12,fontFamily:'inherit'};
  const lbl = {color:t.muted,fontSize:11,fontWeight:500,display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'.05em'};

  const saveAccount = async() => {
    if(!form.displayName.trim()){ toast('Name cannot be empty','error'); return; }
    if(form.phone && !/^[+\d][\d\s-]{6,}$/.test(form.phone)){ toast('Enter a valid phone number','error'); return; }
    setSaving(true);
    try {
      const patch = {
        displayName:form.displayName.trim(), phone:form.phone.trim(), address:form.address.trim(),
        bloodGroup:form.bloodGroup, medicalInfo:form.medicalInfo.trim(),
        emergencyContacts:contacts.filter(c=>c.name?.trim()&&c.phone?.trim()),
      };
      await ProfileService.update(user.uid, patch);
      setUser(u=>({...u, ...patch}));
      await ActivityService.log('profile_updated', `${form.displayName} updated their profile`, {userId:user.uid});
      await NotificationService.push(user.uid, {type:'profile', title:'Profile updated', body:'Your emergency profile was saved.'});
      toast('Profile saved','success');
    } catch(err){ toast(err.message||'Failed to save','error'); }
    finally { setSaving(false); }
  };

  const updateContact = (i,key,val)=> setContacts(cs=>cs.map((c,idx)=>idx===i?{...c,[key]:val}:c));
  const addContact = ()=> setContacts(cs=>[...cs,{name:'',phone:'',relation:'Friend'}]);
  const removeContact = (i)=> setContacts(cs=>cs.filter((_,idx)=>idx!==i));

  const THEMES = [
    {key:'light', icon:'☀️', label:'Light Mode'},
    {key:'dark', icon:'🌙', label:'Dark Mode'},
    {key:'system', icon:'🖥️', label:'System Default'},
  ];

  const changeTheme = async(key) => {
    setPref(key);
    toast(`Theme: ${key}`,'success',1600);
    try { await ProfileService.update(user.uid, {theme:key}); } catch {}
  };

  return (
    <div style={{height:'100%',overflowY:'auto',paddingBottom:90,background:t.bg}}>
      <div style={{padding:'48px 20px 16px',background:`linear-gradient(160deg,${t.gradA},${t.gradB})`,borderBottom:`1px solid ${t.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{width:48,height:48,borderRadius:24,background:'linear-gradient(135deg,#6366f1,#4338ca)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>⚙️</div>
          <div>
            <h2 style={{color:t.text,fontSize:18,fontWeight:700}}>Settings</h2>
            <p style={{color:t.muted,fontSize:12}}>{user?.email}</p>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {[['account','Account'],['theme','Theme'],['auth','Account & Session']].map(([k,label])=>(
            <button key={k} onClick={()=>setSection(k)}
              style={{flex:1,padding:'8px',borderRadius:12,border:`1px solid ${section===k?'rgba(99,102,241,.4)':t.border2}`,background:section===k?'rgba(99,102,241,.12)':'transparent',color:section===k?'#818cf8':t.dim,fontSize:11,fontWeight:600,cursor:'pointer'}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'16px 16px 0'}}>
        {loadingProfile && section==='account' && (
          <div style={{display:'flex',justifyContent:'center',padding:24}}>
            <div style={{width:24,height:24,border:`2px solid ${t.border2}`,borderTopColor:'#6366f1',borderRadius:'50%'}} className="spin"/>
          </div>
        )}

        {section==='account' && !loadingProfile && <>
          <div style={card}>
            <p style={{color:t.soft,fontSize:13,fontWeight:600,marginBottom:14}}>Personal Information</p>
            <label style={lbl}>Full Name</label>
            <input style={inp} value={form.displayName} onChange={e=>setForm(f=>({...f,displayName:e.target.value}))} placeholder="Your name"/>
            <label style={lbl}>Phone Number</label>
            <input style={inp} type="tel" value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="+91-XXXXXXXXXX"/>
            <label style={lbl}>Address</label>
            <textarea style={{...inp,height:64,resize:'none'}} value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Home / current address"/>
            <label style={lbl}>Blood Group</label>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:12}}>
              {BLOOD.map(bg=>(
                <button key={bg} onClick={()=>setForm(f=>({...f,bloodGroup:bg}))}
                  style={{padding:'10px',borderRadius:12,border:`1px solid ${form.bloodGroup===bg?'#FF3B30':t.border2}`,background:form.bloodGroup===bg?'rgba(255,59,48,.15)':'transparent',color:form.bloodGroup===bg?'#f87171':t.muted,fontSize:13,fontWeight:700,cursor:'pointer'}}>{bg}</button>
              ))}
            </div>
            <label style={lbl}>Medical Information</label>
            <textarea style={{...inp,height:72,resize:'none',marginBottom:0}} value={form.medicalInfo} onChange={e=>setForm(f=>({...f,medicalInfo:e.target.value}))} placeholder="Allergies, conditions, medications…"/>
          </div>

          <div style={card}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <p style={{color:t.soft,fontSize:13,fontWeight:600}}>Emergency Contacts</p>
              <button onClick={addContact} style={{background:'rgba(16,185,129,.12)',border:'1px solid rgba(16,185,129,.3)',color:'#34d399',fontSize:12,fontWeight:600,borderRadius:9,padding:'5px 10px',cursor:'pointer'}}>+ Add</button>
            </div>
            {contacts.map((c,i)=>(
              <div key={i} style={{padding:12,borderRadius:16,border:`1px solid ${t.border}`,marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{color:t.muted,fontSize:11,fontWeight:600}}>Contact {i+1}</span>

          <button onClick={saveAccount} disabled={saving}
            style={{width:'100%',padding:15,borderRadius:24,background:'linear-gradient(135deg,#6366f1,#4338ca)',border:'none',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',opacity:saving?.7:1,marginBottom:16}}>
            {saving?'Saving…':'Save Changes'}
          </button>
        </>}

        {section==='theme' && <>
          <div style={card}>
            <p style={{color:t.soft,fontSize:13,fontWeight:600,marginBottom:14}}>Appearance</p>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {THEMES.map(th=>(
                <button key={th.key} onClick={()=>changeTheme(th.key)}
                  style={{display:'flex',alignItems:'center',gap:12,padding:'14px',borderRadius:16,border:`1px solid ${pref===th.key?'rgba(99,102,241,.5)':t.border2}`,background:pref===th.key?'rgba(99,102,241,.12)':'transparent',cursor:'pointer',textAlign:'left'}}>
                  <span style={{fontSize:22}}>{th.icon}</span>
                  <span style={{flex:1,color:pref===th.key?'#818cf8':t.text,fontSize:14,fontWeight:600}}>{th.label}</span>

                <span style={{width:6,height:6,borderRadius:'50%',background:'#34d399'}} className="pulse"/> Active
              </span>
            </div>
            <div style={{padding:'10px 12px',borderRadius:12,background:t.surface2,fontSize:12,color:t.muted}}>

          <button onClick={onSignOut}

  );

// ─── Live Tracking Map ───────────────────────────────────────────────────────
// Shows the user plus any assigned ambulance / rescue team / drone using a
// lightweight SVG map driven by real-time RTDB listeners (no refresh needed).
function LiveTrackingScreen({user, location, activeSos}) {
  const {t, resolved} = useTheme();
  const [units,setUnits] = useState({ambulance:null,team:null,drone:null});

  useEffect(()=>{
    if(DEMO_MODE) return;
    const refs=[];
    const watch = (path, id, key) => {
      if(!id) return;
      const r = db.ref(`${path}/${id}`);
      const h = r.on('value', s=> setUnits(u=>({...u,[key]:s.exists()?{id,...s.val()}:null})), e=>console.error('[LiveTracking]',e));
      refs.push(()=>r.off('value',h));
    };
    watch('ambulances', activeSos?.assignedAmbulanceId, 'ambulance');
    watch('rescue_teams', activeSos?.assignedTeamId, 'team');
    watch('drones', activeSos?.droneId || activeSos?.assignedDroneId, 'drone');
    return ()=> refs.forEach(off=>off());
  },[activeSos?.assignedAmbulanceId, activeSos?.assignedTeamId, activeSos?.droneId]);

  const center = location || {latitude:11.0168, longitude:76.9558};
  const project = (loc) => {
    if(!loc) return null;
    const scale=4000; // px per degree
    return { x:160 + (loc.longitude-center.longitude)*scale, y:160 - (loc.latitude-center.latitude)*scale };
  };
  const markers = [
    {key:'user', loc:location, color:'#10b981', icon:'📍', label:'You'},
    units.ambulance&&{key:'amb', loc:unitLoc(units.ambulance), color:'#FF3B30', icon:'🚑', label:units.ambulance.name||'Ambulance'},
    units.team&&{key:'team', loc:unitLoc(units.team), color:'#3b82f6', icon:'🦺', label:units.team.name||'Rescue Team'},
    units.drone&&{key:'drone', loc:unitLoc(units.drone), color:'#a78bfa', icon:'🚁', label:units.drone.name||'Drone'},
  ].filter(Boolean);

  return (
    <div style={{height:'100%',overflowY:'auto',paddingBottom:90,backgroundColor:'#07080A'}}>
      <div style={{padding:'48px 20px 16px',backgroundColor:'#07080A'}}>
        <h2 style={{color:'#F0F1F3',fontSize:18,fontWeight:'900',letterSpacing:'0.3px',margin:0}}>Live Tracking</h2>
        <p style={{color:'#64748B',fontSize:12,margin:0,marginTop:2,fontWeight:'600'}}>Real-time positions of you &amp; assigned units</p>
      </div>

      {!activeSos
        ? <EmptyState icon="🛰️" title="No active emergency" subtitle="When you trigger an SOS, your assigned ambulance, rescue team and drone will appear here in real time."/>
        : <div style={{padding:16}}>
            <div style={{borderRadius:24,overflow:'hidden',border:'1px solid #1E293B',background:'#070B14',marginBottom:14}}>
              <svg viewBox="0 0 320 320" style={{width:'100%',display:'block',background:'radial-gradient(circle at 50% 50%, rgba(255,59,48,.03), transparent 70%)'}}>
                {/* grid */}
                {[0,1,2,3,4].map(i=>(<g key={i}>
                  <line x1={i*80} y1="0" x2={i*80} y2="320" stroke="rgba(255,255,255,0.02)" strokeWidth="0.5"/>
                  <line x1="0" y1={i*80} x2="320" y2={i*80} stroke="rgba(255,255,255,0.02)" strokeWidth="0.5"/>
                </g>))}
                {/* connection lines from user to units */}
                {project(location) && markers.filter(m=>m.key!=='user'&&project(m.loc)).map(m=>{
                  const u=project(location), p=project(m.loc);
                  return <line key={'l'+m.key} x1={u.x} y1={u.y} x2={p.x} y2={p.y} stroke={m.color} strokeWidth="1.5" strokeDasharray="4 4" opacity="0.4"/>;
                })}
                {markers.map(m=>{ const p=project(m.loc); if(!p) return null; return (
                  <g key={m.key}>
                    <circle cx={p.x} cy={p.y} r="16" fill={m.color} opacity="0.15"/>
                    <circle cx={p.x} cy={p.y} r="6" fill={m.color}/>
                    <text x={p.x} y={p.y-14} fontSize="14" textAnchor="middle">{m.icon}</text>
                  </g>
                );})}
              </svg>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {markers.map(m=>{
                const d = m.key==='user'?null:haversineKm(location, unitLocSafe(m.loc));
                return (
                  <div key={'c'+m.key} style={{padding:12,borderRadius:20,background:'#101216',border:'1px solid #1E293B',display:'flex',alignItems:'center',gap:12}}>
                    <div style={{width:38,height:38,borderRadius:11,background:`${m.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{m.icon}</div>
                    <div style={{flex:1}}>
                      <p style={{color:'#FFFFFF',fontSize:14,fontWeight:'700',margin:0}}>{m.label}</p>
                      <p style={{color:'#64748B',fontSize:12,margin:0,marginTop:2,fontWeight:'600'}}>
                        {m.key==='user'?'Your location':`${fmtDistance(d)} · ETA ${fmtEta(d)}${m.loc?.status?` · ${String(m.loc.status).replace(/_/g,' ')}`:''}`}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>}
    </div>
  );
}
function unitLoc(u){ if(!u) return null; if(u.location) return u.location; if(u.latitude!=null&&u.longitude!=null) return {latitude:u.latitude,longitude:u.longitude}; return null; }
function unitLocSafe(u){ return unitLoc(u)||u; }

// ─── Main App ──────────────────────────────────────────────────────────────
function App() {
  const themeCtx = useTheme();
  const {t} = themeCtx;
  const {toast} = useToast();
  const [screen,setScreen] = useState('splash');
  const [tab,setTab] = useState('home');
  const [user,setUser] = useState(null);
  const [location,setLocation] = useState(null);
  const [gpsStatus,setGpsStatus] = useState('acquiring');
  const [sosActive,setSosActive] = useState(false);
  const [activeSos,setActiveSos] = useState(null);
  const [selectedType,setSelectedType] = useState(null);
  const [history,setHistory] = useState([]);
  const [navHistory,setNavHistory] = useState([]);
  const [notifications,setNotifications] = useState([]);

  // Handle preview frame messages
  useEffect(() => {
    const handleMsg = (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data && e.data.type === 'NAVIGATE') {
        const target = e.data.screen;
        if (target === 'splash') {
          setScreen('splash');
        } else if (['home', 'sos', 'ai', 'profile'].includes(target)) {
          setScreen('main');
          setTab(target);
        }
      }
    };
    window.addEventListener('message', handleMsg);
    return () => window.removeEventListener('message', handleMsg);
  }, []);

  // GPS — real device location, no fake fallback
  useEffect(()=>{
    if(!navigator.geolocation){ setGpsStatus('unavailable'); return; }
    setGpsStatus('acquiring');

    const onSuccess = (pos) => {
      setLocation({
        latitude:  pos.coords.latitude,
        longitude: pos.coords.longitude,
        altitude:  pos.coords.altitude,
        accuracy:  pos.coords.accuracy,
        timestamp: Date.now()
      });
      setGpsStatus('active');
    };

    const onError = (err) => {
      // code 1 = permission denied, 2 = unavailable, 3 = timeout
      setLocation(null);
      setGpsStatus(err.code === 1 ? 'denied' : 'unavailable');
    };

    const opts = {enableHighAccuracy:true, timeout:15000, maximumAge:0};
    // Immediate single fix then continuous watch
    navigator.geolocation.getCurrentPosition(onSuccess, onError, opts);
    const wid = navigator.geolocation.watchPosition(onSuccess, onError, opts);
    return ()=> navigator.geolocation.clearWatch(wid);
  },[]);

  // Apply persisted theme from the user's profile once it loads.
  // (ThemeProvider already restored from localStorage; profile is source of truth.)
  useEffect(()=>{
    if(user?.theme && user.theme!==themeCtx.pref) themeCtx.setPref(user.theme);
  },[user?.theme]);

  // Firebase auth — restore session and always hydrate FRESH profile from RTDB.
  useEffect(()=>{
    if(DEMO_MODE) return;
    const unsub = auth.onAuthStateChanged(async fbUser=>{
      if(fbUser) {
        try {
          const d = (await ProfileService.fetchLatest(fbUser.uid)) || {};
          const u = {uid:fbUser.uid,email:fbUser.email,displayName:d.displayName||'User',role:d.role||'user',
            phone:d.phone||'', address:d.address||'', bloodGroup:d.bloodGroup||'O+',
            medicalInfo:d.medicalInfo||'', emergencyContacts:d.emergencyContacts||[], theme:d.theme||'system'};
          setUser(u);
          setScreen(s=> s==='splash' ? s : 'main');
        } catch(err) {
          console.error('[onAuthStateChanged] Failed to load profile:', err);
          toast('Could not load your profile. Check your connection.','error');
        }
      } else {
        setUser(null);
      }
    });
    return unsub;
  },[]);

  // Live notifications listener (drives the badge + Notification Center).
  useEffect(()=>{
    if(!user?.uid) { setNotifications([]); return; }
    const unsub = NotificationService.subscribe(user.uid, setNotifications);
    return unsub;
  },[user?.uid]);

  // Track the user's most recent active/assigned SOS in real time for live map.
  useEffect(()=>{
    if(DEMO_MODE || !user?.uid) return;
    const ref = db.ref('emergencies');
    const h = ref.on('value', s=>{
      const v=s.val()||{};
      const mine=Object.keys(v).map(k=>({id:k,...v[k]}))
        .filter(e=>e.userId===user.uid && (e.status==='active'||e.status==='assigned'||e.status==='en_route'||e.status==='on_scene'))
        .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      setActiveSos(mine[0]||null);
      setSosActive(mine.length>0);
    }, e=>console.error('[App active sos]',e));
    return ()=> ref.off('value', h);
  },[user?.uid]);

  const handleAuth = (u) => { setUser(u); setScreen('main'); };
  const handleSOSTrigger = (e) => { setHistory(h=>[e,...h]); };

  // Full logout cleanup → return to auth screen.
  const handleSignOut = async () => {
    try { if(!DEMO_MODE) await auth.signOut(); } catch(e){ console.error('[signOut]',e); }
    setUser(null); setNotifications([]); setActiveSos(null); setSosActive(false);
    setHistory([]); setNavHistory([]); setTab('home'); setScreen('auth');
    toast('Signed out','success',1600);
  };

  // Navigate forward — push current tab into history stack
  const handleTabChange = (t) => {
    setNavHistory(prev => [...prev, tab]);
    setTab(t);
  };

  // Navigate back — pop previous tab from stack
  const handleBack = () => {
    setNavHistory(prev => {
      if(prev.length === 0) return prev;
      const prevTab = prev[prev.length - 1];
      setTab(prevTab);
      return prev.slice(0, -1);
    });
  };

  if(screen==='splash') return <SplashScreen onStart={()=>setScreen('auth')}/>;
  if(screen==='auth') return <AuthScreen onAuth={handleAuth}/>;

  const SCREEN_TITLES = {
    home:'Home', emergency:'Emergencies', sos:'Smart SOS', ai:'ResQAI',
    profile:'Profile', nearby:'Nearby Services', history:'History',
    drone:'Drone Control', bluetooth:'BlueBeacon', medical:'Medical Profile',
    settings:'Settings', notifications:'Notifications', tracking:'Live Tracking'
  };

  const canGoBack = navHistory.length > 0 && tab !== 'home';
  const unreadCount = notifications.filter(n=>!n.read).length;

  const SCREENS = {
    home:      <HomeScreen user={user} location={location} gpsStatus={gpsStatus} sosActive={sosActive} setSosActive={setSosActive} setTab={handleTabChange} emergencyHistory={history} unreadCount={unreadCount}/>,
    emergency: <EmergencyScreen onSelect={t=>{setSelectedType(t);handleTabChange('sos');}} selectedType={selectedType} onFirstAid={()=>{}}/>,
    sos:       <SOSScreen user={user} location={location} gpsStatus={gpsStatus} selectedType={selectedType} sosActive={sosActive} setSosActive={setSosActive} onSOSTrigger={handleSOSTrigger} emergencyHistory={history}/>,
    ai:        <AIScreen user={user}/>,
    profile:   <ProfileScreen user={user}/>,
    nearby:    <NearbyScreen location={location} gpsStatus={gpsStatus}/>,
    history:   <HistoryScreen emergencyHistory={history}/>,
    drone:     <DroneScreen/>,
    bluetooth: <BluetoothScreen user={user} location={location}/>,
    medical:   <ProfileScreen user={user}/>,
    settings:  <SettingsScreen user={user} setUser={setUser} onSignOut={handleSignOut}/>,
    notifications: <NotificationScreen user={user} notifications={notifications}/>,
    tracking:  <LiveTrackingScreen user={user} location={location} activeSos={activeSos}/>,
  };

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:t.bg,maxWidth:430,margin:'0 auto',position:'relative',overflow:'hidden'}}>
      <OfflineBanner/>
      <div style={{flex:1,overflow:'hidden',position:'relative'}}>
        {/* ← Back button — top-left, all screens except Home */}
        {canGoBack && (
          <BackButton
            onBack={handleBack}
            label={SCREEN_TITLES[navHistory[navHistory.length-1]] || 'Back'}
          />
        )}
        {SCREENS[tab]||SCREENS.home}
      </div>
      <BottomNav tab={tab} setTab={handleTabChange} sosActive={sosActive} sosLevel={activeSos?.level}/>
    </div>
  );
}

function Root() {
  return (
    <ThemeProvider>
      <ToastProvider>
        <App/>
      </ToastProvider>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
